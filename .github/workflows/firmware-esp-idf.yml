name: ESP-IDF firmware build

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-esp-idf.yml'
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-esp-idf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ESP-IDF host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Build StackChan firmware (ESP-IDF v6.1, ESP32-S3, Japanese)
        run: bash firmware/build.sh

      - name: Verify flash images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          build = Path('firmware/.build/StackChan/firmware/build-route')
          manifest = build / 'flasher_args.json'
          flash_files = json.loads(manifest.read_text())['flash_files']
          for name in {'stack-chan.bin', *flash_files.values()}:
              path = build / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty firmware image: {path}')
              print(f'{path}: {path.stat().st_size} bytes')
          PY

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-esp32s3-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            firmware/.build/StackChan/firmware/build-route/**/*.bin
            firmware/.build/StackChan/firmware/build-route/flasher_args.json
            firmware/.build/StackChan/firmware/build-route/flash_args
            firmware/.build/StackChan/firmware/build-route/flash_project_args
            firmware/.build/StackChan/firmware/sdkconfig.route
