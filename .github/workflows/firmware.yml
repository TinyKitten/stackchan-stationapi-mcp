name: ESP-IDF firmware build

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STACKCHAN_BUILD_ROOT: ${{ runner.temp }}/stackchan-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Build Japanese StackChan firmware with ESP-IDF v6.1
        run: bash firmware/build.sh

      - name: Collect flash binaries and build metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["STACKCHAN_BUILD_ROOT"])
          project = root / "StackChan" / "firmware"
          build = project / "build-route"
          output = Path("firmware-artifact")
          output.mkdir()
          # Preserve paths from ESP-IDF's flash manifest, including any data partitions.
          manifest = json.loads((build / "flasher_args.json").read_text())
          for filename in manifest["flash_files"].values():
              source = (build / filename).resolve()
              relative = source.relative_to(build.resolve())
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          for name in ("flasher_args.json", "flash_args"):
              shutil.copy2(build / name, output / name)
          for pattern in ("*.elf", "*.map"):
              for source in build.glob(pattern):
                  shutil.copy2(source, output / source.name)
          shutil.copy2(project / "sdkconfig.route", output / "sdkconfig.route")
          (output / "BUILD.txt").write_text(
              "ESP-IDF: v6.1\n"
              "StackChan: 28b9f0c8bd6acd81cb3c70f1a93c3e373b39d400\n"
              f"Patch repository commit: {os.environ['GITHUB_SHA']}\n"
              "Target: ESP32-S3 / StackChan / Japanese\n"
          )
          PY

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-esp32s3-ja-${{ github.sha }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stackchan-build/StackChan/firmware/build-route/log/
            ${{ runner.temp }}/stackchan-build/StackChan/firmware/build-route/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
